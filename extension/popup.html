<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 320px; font: 14px -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #1c1c1e; background: #f6f5f2; }
  main { padding: 14px; display: grid; gap: 8px; }
  b { font-size: 15px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 110px; border: 1px solid #e2dfd8; border-radius: 10px; padding: 8px; font: inherit; resize: vertical; background: #fff; }
  small { color: #6b6a66; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { border: 0; border-radius: 10px; background: #c8553d; color: #fff; font-weight: 700; padding: 9px; font-size: 14px; cursor: pointer; }
  @media (prefers-color-scheme: dark) { body { background: #17181b; color: #ecebe7; } textarea { background: #212226; color: #ecebe7; border-color: #34353a; } small { color: #9b9a95; } }
</style>
</head>
<body>
<main>
  <b>Mindrawer にしまう</b>
  <textarea id="text" placeholder="メモを書く（空ならページの題名をしまいます）"></textarea>
  <small id="url"></small>
  <button id="save" type="button">しまう</button>
</main>
<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
