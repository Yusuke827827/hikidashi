# Mac でビルドとテストを行う。
#   test: 共通処理（HikidashiCore）のテスト
#   app:  アプリ本体と共有シートの拡張機能（App）を iOS シミュレーター向けにビルドし、
#         見本モードで起動して画面写真を撮る（scripts/screenshots.sh）。写真は成果物「screenshots」に入る
name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
        working-directory: HikidashiCore

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: bash scripts/screenshots.sh screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn
