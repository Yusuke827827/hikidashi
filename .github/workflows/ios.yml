# Mac でビルドとテストを行う。
#   test: 共通処理（HikidashiCore）のテスト
#   app:  アプリ本体と共有シートの拡張機能（App）を iOS シミュレーター向けにビルドし、
#         見本モードで起動して画面写真を撮る（scripts/screenshots.sh）。写真は成果物「screenshots」に入り、
#         main のときは screenshots ブランチにも置く
name: iOS

on:
  push:
    branches-ignore: [screenshots]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチの実行は順番に（screenshots ブランチへの書き込みがぶつからないように）
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
        working-directory: HikidashiCore

  app:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: bash scripts/screenshots.sh screenshots
      # App Store 用の宣伝画像（見出し付き）を作る
      - run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pillow
          /tmp/venv/bin/python scripts/store_shots.py screenshots screenshots/store
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
      # main の写真は screenshots ブランチにも置く（ブラウザや git からそのまま見られるように）
      - name: Publish to screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          SHA=$(git rev-parse --short HEAD)
          rm -rf /tmp/shots && mkdir /tmp/shots && cp -R screenshots/. /tmp/shots/
          cd /tmp/shots
          printf '# 画面写真\n\nmain の %s から自動で撮影。\n\n' "$SHA" > README.md
          for lang in ja en; do
            [ -d "store/$lang" ] || continue
            printf '## App Store 用（%s）\n\n' "$lang" >> README.md
            for f in store/$lang/*.png; do printf '<img src="%s" width="200"> ' "$f" >> README.md; done
            printf '\n\n' >> README.md
          done
          printf '## 画面\n\n' >> README.md
          for f in *.png; do printf '### %s\n<img src="%s" width="300">\n\n' "${f%.png}" "$f" >> README.md; done
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "画面写真（main $SHA）"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
